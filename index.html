<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E9EDF2">
<title>Spotter</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --chalk:#E9EDF2;--paper:#FFFFFF;--ink:#101828;--slate:#5B6778;--rule:#D5DBE4;
  --cobalt:#2B4EFF;--cobalt-d:#1B37C9;--cobalt-t:#E4E9FF;
  --signal:#12A37A;--warn:#F5A623;--alert:#E5484D;
  --disp:'Archivo','Arial Narrow',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--chalk);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);font-stretch:112%;margin:0;letter-spacing:-.01em;line-height:1.05}
h1{font-size:30px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--slate)}
.small{font-size:13px}
#app{max-width:560px;margin:0 auto;padding:14px 16px 190px}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.brand{font-family:var(--disp);font-stretch:125%;font-weight:900;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:26px;height:10px;background:var(--ink);border-radius:2px;position:relative}
.brand i:before,.brand i:after{content:"";position:absolute;top:-4px;width:5px;height:18px;background:var(--cobalt);border-radius:2px}
.brand i:before{left:-3px}.brand i:after{right:-3px}
.lvl{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:99px;padding:5px 12px 5px 6px;font-weight:700;font-size:13px}
.lvl svg{width:26px;height:26px}
.lvl .bar{width:44px;height:5px;background:var(--rule);border-radius:9px;overflow:hidden}
.lvl .bar b{display:block;height:100%;background:var(--cobalt)}
.card{background:var(--paper);border-radius:18px;padding:16px;margin-bottom:12px}
.card h3{margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:99px;background:var(--chalk);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:7px;border:2px solid transparent;transition:background .15s,color .15s}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip.on{background:var(--ink);color:#fff}
.chip.on i{box-shadow:0 0 0 2px #fff}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chalk);border-radius:14px;padding:4px;gap:4px}
.seg button{padding:9px 6px;border-radius:11px;font-weight:700;font-size:14px}
.seg button.on{background:var(--paper);box-shadow:0 1px 3px rgba(16,24,40,.15)}
.lbl{font-weight:700;font-size:13px;color:var(--slate);margin:14px 0 8px}
.lbl:first-child{margin-top:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;font-weight:800;font-size:15px;background:var(--cobalt);color:#fff;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn:hover{background:var(--cobalt-d)}
.btn.ghost{background:var(--chalk);color:var(--ink)}
.btn.ghost:hover{background:#dde2ea}
.btn.dark{background:var(--ink);color:#fff}
.btn.sm{padding:9px 13px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.link{color:var(--cobalt);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.hero{padding:2px 0 14px}
.hero p{margin-top:6px;color:var(--slate);max-width:44ch}

/* timeline: the time budget */
.tl{display:flex;height:34px;border-radius:10px;overflow:hidden;background:repeating-linear-gradient(135deg,#dfe4ec 0 6px,#e9edf2 6px 12px);gap:2px}
.tl>div{height:100%;min-width:3px;position:relative}
.tl .fix{background:#B7C0CE}
.tl .over{background:var(--alert)}
.tlmeta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.tlmeta b{font-family:var(--disp);font-stretch:112%;font-weight:800;font-size:22px}
.tlmeta span{font-weight:700;font-size:13px}
.st-ok{color:var(--signal)}.st-low{color:#B67A00}.st-over{color:var(--alert)}
.warns{margin-top:10px;display:grid;gap:6px}
.warn{background:#FFF4DB;border-radius:10px;padding:8px 11px;font-size:13px;font-weight:500}
.warn.bad{background:#FFE5E6}

.dropz{border:2px dashed transparent;border-radius:16px;transition:border-color .15s,background .15s}
.dropz.over{border-color:var(--cobalt);background:var(--cobalt-t)}
.pitems{display:grid;gap:8px;margin-top:12px;min-height:64px}
.empty{border:2px dashed var(--rule);border-radius:14px;padding:22px 14px;text-align:center;color:var(--slate);font-weight:500}
.pitem,.lcard{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:14px;padding:8px 10px 8px 6px;user-select:none;-webkit-user-select:none;position:relative}
.pitem{border:1.5px solid var(--rule);cursor:grab}
.pitem.ins:before{content:"";position:absolute;left:0;right:0;top:-6px;height:3px;border-radius:2px;background:var(--cobalt)}
.pitem.last-ins:after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:3px;border-radius:2px;background:var(--cobalt)}
.lcard{margin-bottom:8px;cursor:grab}
.grip{touch-action:none;width:22px;height:40px;display:flex;align-items:center;justify-content:center;color:#9AA5B6;flex:none;cursor:grab}
.grip svg{width:14px;height:20px}
.thumb{width:54px;height:54px;border-radius:11px;background:var(--chalk);flex:none;overflow:hidden}
.thumb svg{width:100%;height:100%;display:block}
.ptxt{flex:1;min-width:0}
.ptxt b{display:block;font-weight:700;font-size:15px;line-height:1.2}
.ptxt span{font-size:12.5px;color:var(--slate)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--cobalt-t);color:var(--cobalt-d);margin-left:4px;vertical-align:1px}
.iconbtn{width:36px;height:36px;border-radius:10px;background:var(--chalk);display:flex;align-items:center;justify-content:center;flex:none;font-size:20px;font-weight:700}
.iconbtn:hover{background:#dde2ea}
.dragging{opacity:.35}
#ghost{position:fixed;z-index:200;pointer-events:none;display:none;width:min(320px,80vw);box-shadow:0 14px 34px rgba(16,24,40,.28);border-radius:14px;transform:rotate(-1.5deg)}
.libhead{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 10px}
.libhead span{font-size:13px;color:var(--slate)}
.tdot{width:8px;height:40px;border-radius:4px;flex:none;margin-left:2px}

/* build layout */
.buildgrid{display:block}
.c-plan .card{margin-top:0}
.dock{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:30;padding:0 12px}
.dock .in{max-width:536px;margin:0 auto;background:var(--ink);color:#fff;border-radius:18px;padding:10px 12px 10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(16,24,40,.35)}
.dock .in.over{background:var(--cobalt-d)}
.dock .mini{flex:1;min-width:0}
.dock .mini b{font-weight:800;font-size:14px;display:block}
.dock .mini .tl{height:8px;border-radius:4px;margin-top:6px;background:repeating-linear-gradient(135deg,#2c3a55 0 4px,#1b2640 4px 8px)}
.dock .btn{background:#fff;color:var(--ink);padding:11px 16px}
.dock .btn.go{background:var(--cobalt);color:#fff}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--rule);padding:6px 12px calc(6px + env(safe-area-inset-bottom))}
.tabs .in{max-width:536px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tabs button{padding:9px;border-radius:12px;font-weight:800;font-size:14px;color:var(--slate);display:flex;align-items:center;justify-content:center;gap:8px}
.tabs button.on{background:var(--cobalt-t);color:var(--cobalt-d)}
.tabs svg{width:20px;height:20px}
@media(min-width:960px){
  #app{max-width:1060px;padding-bottom:110px}
  .buildgrid{display:grid;grid-template-columns:minmax(0,1fr) 420px;grid-template-areas:"ctl plan" "lib plan";column-gap:28px;align-items:start}
  .c-ctl{grid-area:ctl}.c-lib{grid-area:lib}
  .c-plan{grid-area:plan;position:sticky;top:12px}
  .dock{display:none}
  .lib{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .lib .lcard{margin:0}
  .only-wide{display:flex!important}
}
.only-wide{display:none;gap:8px;margin-top:12px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:120;background:rgba(16,24,40,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .pane{background:var(--chalk);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:700px){.sheet{align-items:center}.sheet .pane{border-radius:24px}}
.demo{background:var(--paper);border-radius:18px;padding:10px}
.demo .anim{aspect-ratio:1/.8;width:100%}
.demo .anim svg{width:100%;height:100%;display:block}
.poses{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pose{background:var(--chalk);border-radius:12px;position:relative;overflow:hidden}
.pose svg{display:block;width:100%;aspect-ratio:1/.85}
.pose b{position:absolute;left:8px;top:6px;font-size:12px;font-weight:800;color:var(--cobalt-d);background:#fff;border-radius:6px;padding:1px 7px}
.list{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.list li{display:flex;gap:10px;align-items:flex-start}
.list li:before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--cobalt);margin-top:8px}
.list.bad li:before{background:var(--alert)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* session */
.session{position:fixed;inset:0;z-index:100;background:var(--chalk);overflow:auto;padding:0 0 30px}
.session[hidden]{display:none}
.sbar{position:sticky;top:0;z-index:5;background:rgba(233,237,242,.94);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:10px 14px}
.sbar .x{width:38px;height:38px;border-radius:11px;background:var(--paper);font-size:18px;font-weight:800}
.sprog{flex:1;display:flex;gap:4px}
.sprog i{flex:1;height:6px;border-radius:3px;background:var(--rule)}
.sprog i.done{background:var(--ink)}
.sprog i.cur{background:var(--cobalt)}
.sbar .el{font-weight:800;font-family:var(--disp);font-stretch:112%;min-width:46px;text-align:right}
.sbody{max-width:560px;margin:0 auto;padding:6px 16px 30px}
.sbody h1{margin:6px 0 4px}
.kv{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.kv span{background:var(--paper);border-radius:10px;padding:6px 11px;font-weight:700;font-size:13.5px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper b{font-family:var(--disp);font-stretch:112%;font-size:28px;font-weight:800;min-width:90px;text-align:center}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0}
.switch button{width:50px;height:30px;border-radius:99px;background:var(--rule);position:relative;transition:background .15s;flex:none}
.switch button:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch button.on{background:var(--cobalt)}
.switch button.on:after{transform:translateX(20px)}
.stage{position:relative;background:#0b1220;border-radius:20px;overflow:hidden;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.stage canvas{width:100%;height:100%;object-fit:contain;display:block}
.stage#stage{max-height:68vh}
.stage .msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;font-weight:700;text-align:center;padding:20px;background:rgba(11,18,32,.6)}
.stage.demo-stage{background:var(--paper);aspect-ratio:1/.72}
.stage.demo-stage .anim{width:100%;height:100%}
.stage.demo-stage .anim svg{width:100%;height:100%}
.counter{display:flex;align-items:flex-end;justify-content:space-between;margin:14px 2px 6px}
.counter .big{font-family:var(--disp);font-stretch:125%;font-weight:900;font-size:92px;line-height:.85;letter-spacing:-.04em}
.counter .of{font-weight:700;color:var(--slate);text-align:right;line-height:1.25}
.cuebox{background:var(--paper);border-radius:14px;padding:12px 14px;font-weight:700;min-height:48px;display:flex;align-items:center;gap:10px}
.cuebox i{width:10px;height:10px;border-radius:50%;background:var(--signal);flex:none}
.cuebox.warn i{background:var(--warn)}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ctrls .btn{padding:14px 10px}
.ctrls .wide{grid-column:1/3}
.pillrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pillbtn{padding:8px 12px;border-radius:99px;background:var(--paper);font-weight:700;font-size:13px;display:inline-flex;gap:7px;align-items:center}
.pillbtn.on{background:var(--ink);color:#fff}
.pillbtn.rec.on{background:var(--alert)}
.pillbtn.rec.on i{animation:blink 1s infinite}
.pillbtn i{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block}
@keyframes blink{50%{opacity:.2}}
.ring{position:relative;width:230px;height:230px;margin:18px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-stretch:125%;font-weight:900;font-size:56px}
.next{background:var(--paper);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.sum div{background:var(--paper);border-radius:16px;padding:14px}
.sum b{display:block;font-family:var(--disp);font-stretch:112%;font-weight:800;font-size:30px;line-height:1}
.sum span{font-size:13px;color:var(--slate);font-weight:500}
.clip{background:var(--paper);border-radius:14px;padding:10px;margin-bottom:8px}
.clip video{width:100%;border-radius:10px;background:#000}
.badge-new{background:var(--ink);color:#fff;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;margin-bottom:8px}
.badge-new .ic{width:44px;height:44px;border-radius:12px;background:var(--cobalt);display:flex;align-items:center;justify-content:center;font-size:22px}

/* progress */
.hero2{background:var(--ink);color:#fff;border-radius:22px;padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:12px}
.hero2 svg{width:92px;height:92px;flex:none;background:#1b2840;border-radius:16px}
.hero2 .bar{height:8px;border-radius:5px;background:#2c3a55;margin-top:8px;overflow:hidden}
.hero2 .bar b{display:block;height:100%;background:var(--cobalt)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--paper);border-radius:16px;padding:12px}
.stats b{display:block;font-family:var(--disp);font-stretch:112%;font-weight:800;font-size:26px;line-height:1.05}
.stats span{font-size:12.5px;color:var(--slate)}
.wk{display:flex;align-items:flex-end;gap:8px;height:110px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.wk i{width:100%;border-radius:7px 7px 3px 3px;background:var(--cobalt);min-height:4px}
.wk i.z{background:var(--rule)}
.wk span{font-size:11.5px;color:var(--slate);font-weight:700}
.brow{display:grid;grid-template-columns:78px 1fr 28px;align-items:center;gap:10px;margin:7px 0;font-weight:700;font-size:13.5px}
.brow .tr{height:12px;background:var(--chalk);border-radius:7px;overflow:hidden}
.brow .tr i{display:block;height:100%;border-radius:7px}
.brow em{font-style:normal;text-align:right;color:var(--slate)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bdg{background:var(--chalk);border-radius:14px;padding:10px 6px;text-align:center;font-size:12px;font-weight:700;line-height:1.2}
.bdg .ic{font-size:26px;display:block;margin-bottom:4px}
.bdg.lock{opacity:.4;filter:grayscale(1)}
.pr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rule);font-weight:500}
.pr:last-child{border:0}
.pr b{font-weight:800}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:300;max-width:88vw;text-align:center;animation:up .2s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* dashboard */
.stat{background:var(--paper);border-radius:18px;padding:16px;margin-bottom:12px}
.stat .sl{font-size:17px;font-weight:600}
.stat .sl b{font-family:var(--disp);font-stretch:125%;font-weight:900;font-size:34px;line-height:1;display:inline;margin-right:4px}
.stat .sl span{display:block;margin-top:4px;font-size:13px;color:var(--slate);font-weight:500}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.strip div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--slate)}
.strip i{width:26px;height:26px;border-radius:50%;border:2px solid var(--rule);display:block}
.strip .on i{background:var(--signal);border-color:var(--signal)}
.strip .td i{border-color:var(--ink)}.strip .td.on i{border-color:var(--signal);box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.strip .td span{color:var(--ink)}
.winl{display:flex;gap:10px;align-items:baseline;background:#E4F5EF;color:#0B6B50;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;line-height:1.35}
.winl b{font-size:11px;text-transform:uppercase;letter-spacing:.06em;flex:none}
.nx{background:var(--paper);border-radius:18px;padding:14px 16px 14px 18px;margin-bottom:10px;border-left:6px solid var(--cobalt)}
.nx.big{padding:18px 18px 16px 20px;box-shadow:0 2px 0 var(--rule)}
.nx.t-fix,.nx.t-persist{border-left-color:var(--alert)}.nx.t-skip,.nx.t-nocam{border-left-color:var(--warn)}.nx.t-away,.nx.t-steady,.nx.t-first{border-left-color:var(--signal)}
.nxh{font-family:var(--disp);font-stretch:112%;font-weight:800;font-size:20px;line-height:1.15}
.nx:not(.big) .nxh{font-size:16px}
.nx p{margin:6px 0 12px;color:var(--slate);font-size:15px;line-height:1.4}
.nx:not(.big) p{margin-bottom:10px;font-size:14px}
.nxb{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--slate);font-weight:600;margin-bottom:12px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.dd{display:inline-block;width:10px;height:10px;position:relative;flex:none}
.dc{border-radius:50%;background:var(--signal)}
.dt{background:var(--warn);transform:rotate(45deg) scale(.85)}
.dx::before,.dx::after{content:"";position:absolute;left:-1px;right:-1px;top:3.5px;height:2.5px;background:var(--alert);border-radius:2px}
.dx::before{transform:rotate(45deg)}.dx::after{transform:rotate(-45deg)}
.fx{padding:10px 0;border-top:1px solid var(--rule)}.fx:first-of-type{border-top:0;padding-top:0}
.fxn{font-weight:800;font-size:15px;margin-bottom:6px}
.fxr{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;align-items:baseline;padding:6px 0}
.fxm{grid-column:1/-1}.dg{display:inline-flex;gap:4px;margin:0 10px 4px 0}
.more summary{cursor:pointer;color:var(--cobalt);font-weight:700;font-size:14px;padding:10px 0 4px}
.dd{width:9px;height:9px}
.fxd{font-size:12px;color:var(--slate);font-weight:600}

const CAMHINT={
  squat:'Prop your phone about 2 m away at hip height and stand side-on so the camera sees your whole body.',
  pushup:'Prop your phone on the floor about 2 m to your side, turned sideways (landscape), so your whole body from hands to feet is in view. Wear clothes that contrast with the floor.',
  curl:'Stand side-on to the camera about 1.5 m away, with your working arm nearest the lens. Keep your elbow tight to your side.',
  press:'Face the camera from about 2 m away so your arms are clear of your head and fully in view.'

// ===================== GEOMETRY & ANIMATION =====================
const G=92;
const L={T:24,U:14,F:13,H:18,S:18,R:5.5};
const dir=a=>{const r=a*Math.PI/180;return[Math.sin(r),Math.cos(r)]};
const add=(p,d,l)=>[p[0]+d[0]*l,p[1]+d[1]*l];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
const unit=v=>{const m=Math.hypot(v[0],v[1])||1;return[v[0]/m,v[1]/m]};
const lerp=(a,b,t)=>a+(b-a)*t;
const alerp=(a,b,t)=>{const d=((b-a+540)%360)-180;return a+d*t};
function ik(H,F,l1,l2,sx=1){
  let dx=F[0]-H[0],dy=F[1]-H[1],d=Math.hypot(dx,dy);const md=l1+l2-0.01;
  if(d>md){dx*=md/d;dy*=md/d;d=md}
  if(d<0.5)d=0.5;
  const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(l1*l1-a*a,0));
  const ux=dx/d,uy=dy/d;let px=-uy,py=ux;if(px*sx<0){px=-px;py=-py}
  return[H[0]+ux*a+px*h,H[1]+uy*a+py*h];
}
function mix(A,B,p){const o={};for(const k in A){o[k]=(k==='hy'||k==='hx'||k==='f1'||k==='f2')?lerp(A[k],B[k],p):alerp(A[k],B[k],p)}return o}
function fk(a){
  const hip=[0,0],sh=add(hip,dir(a.t),L.T),head=add(sh,dir(a.t),L.R+3);
  const el=add(sh,dir(a.ua),L.U),ha=add(el,dir(a.fa),L.F);
  const kn=add(hip,dir(a.th),L.H),ft=add(kn,dir(a.sh),L.S);
  return{hip,sh,head,el,ha,kn,ft};
}
function poseOf(ex,p){
  if(ex.rig==='pushup'){
    const Lb=60,hUp=26.5,hDn=9,h=lerp(hUp,hDn,p),th=Math.asin(h/Lb),thU=Math.asin(hUp/Lb),x0=14;
    const u=[Math.cos(th),-Math.sin(th)];
    const ft=[x0,G],hip=[x0+u[0]*36,G+u[1]*36],sh=[x0+u[0]*60,G+u[1]*60],head=[sh[0]+u[0]*8.5,sh[1]+u[1]*8.5];
    const ha=[x0+60*Math.cos(thU),G],el=ik(sh,ha,L.U,L.F,-1);
    const kn=[(ft[0]+hip[0])/2,(ft[1]+hip[1])/2];
    return{hip,sh,head,el,ha,kn,ft};
  }
  const a=mix(ex.A,ex.B,p);
  if(ex.rig==='leg'){
    const hip=[50+a.hx,G-a.hy],f1=[50+a.f1,G],f2=[50+a.f2,G];
    const sh=add(hip,dir(a.t),L.T),head=add(sh,dir(a.t),L.R+3),el=add(sh,dir(a.ua),L.U),ha=add(el,dir(a.fa),L.F);
    return{hip,sh,head,el,ha,kn:ik(hip,f1,L.H,L.S),ft:f1,kn2:ik(hip,f2,L.H,L.S),ft2:f2};
  }
  const P=fk(a);let my=-1e9;for(const k in P)my=Math.max(my,P[k][1]);
  const cx=ex.cx||50,dy=G-my,o={};for(const k in P)o[k]=[P[k][0]+cx,P[k][1]+dy];
  return o;
}
function hlPoint(k,P){
  const m=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
  switch(k){
    case'chest':return[...m(P.sh,P.hip,.28),7.5];
    case'back':return[...m(P.sh,P.hip,.42),8];
    case'delts':return[...P.sh,6.2];
    case'arm':return[...m(P.sh,P.el,.5),5.6];
    case'quads':return[...m(P.hip,P.kn,.5),7];
    case'glutes':return[...P.hip,7];
    case'core':return[...m(P.hip,P.sh,.32),7];
  }return null;
}
function figSVG(ex,p){
  const P=poseOf(ex,p),col=TARGETS[ex.t].c,I='#33463D',E='#CBD2DE';
  const f=n=>n.toFixed(1);
  const ln=(a,b,w,c=I,o=1)=>`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" opacity="${o}"/>`;
  const pl=(pts,w,c=I,o=1)=>`<polyline points="${pts.map(q=>f(q[0])+','+f(q[1])).join(' ')}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" opacity="${o}"/>`;
  let s='<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">';
  s+=ln([5,G+2.5],[95,G+2.5],1.4,'#D3DAE6');
  if(ex.env){
    const u=unit(sub(P.sh,P.hip));
    if(ex.env==='seat'){
      const o=[u[1],-u[0]];
      s+=ln(add(add(P.hip,u,-5),o,6),add(add(P.sh,u,3),o,6),5,E);
      s+=ln([P.hip[0]-8,P.hip[1]+6],[P.hip[0]+12,P.hip[1]+6],4.5,E);
      s+=ln([P.hip[0]+2,P.hip[1]+6],[P.hip[0]+2,G+2.5],3,E);
    }else{
      const o=[-u[1],u[0]],a=add(add(P.hip,u,-9),o,5.4),b=add(add(P.sh,u,7),o,5.4),mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
      s+=ln(a,b,5,E);s+=ln(mid,[mid[0],G+2.5],3,E);s+=ln([a[0]+2,a[1]],[a[0]+2,G+2.5],3,E);
    }
  }
  if(P.kn2)s+=pl([P.hip,P.kn2,P.ft2],4.2,I,.4);
  s+=pl([P.hip,P.kn,P.ft],4.6);
  s+=ln(P.hip,P.sh,6.6);
  s+=`<circle cx="${f(P.head[0])}" cy="${f(P.head[1])}" r="5.3" fill="${I}"/>`;
  if(ex.tool==='cable'&&ex.anchor){const ay=G-ex.anchor[1]+(ex.anchor[1]>85?-0:0);s+=ln(P.ha,[ex.anchor[0],ex.anchor[1]>85?2:G-ex.anchor[1]],.9,'#8B97AA')}
  s+=pl([P.sh,P.el,P.ha],3.8);
  const h=hlPoint(ex.hl,P);
  if(h)s+=`<circle cx="${f(h[0])}" cy="${f(h[1])}" r="${h[2]}" fill="${col}" opacity="${(.28+.5*p).toFixed(2)}"/><circle cx="${f(h[0])}" cy="${f(h[1])}" r="${h[2]}" fill="none" stroke="${col}" stroke-width="1.2" opacity=".9"/>`;
  if(ex.tool==='db')s+=`<circle cx="${f(P.ha[0])}" cy="${f(P.ha[1])}" r="3.6" fill="#101828"/><circle cx="${f(P.ha[0])}" cy="${f(P.ha[1])}" r="1.3" fill="#fff"/>`;
  else if(ex.tool==='cable'||ex.tool==='handle')s+=`<circle cx="${f(P.ha[0])}" cy="${f(P.ha[1])}" r="2.2" fill="#101828"/>`;
  return s+'</svg>';
}

// ===================== TIME BUDGET =====================
const WARM=240,COOL=180,TRANS=25;
const CONFIGS=[{s:4,r:12,rest:60},{s:3,r:12,rest:60},{s:3,r:10,rest:45},{s:2,r:12,rest:45},{s:2,r:10,rest:30}];
const holdFor=r=>Math.round(r*3/5)*5;
const tgtOf=(ex,c)=>ex.unit==='sec'?holdFor(c.r):c.r;
const workSec=(ex,c)=>ex.unit==='sec'?holdFor(c.r):c.r*3.5;
const exTime=(ex,c)=>c.s*workSec(ex,c)+(c.s-1)*c.rest+TRANS;
function computePlan(ids,minutes){
  const n=ids.length,avail=minutes*60-WARM-COOL,per=n?avail/n:0;
  const items=ids.map(id=>{const ex=EX[id];const c=CONFIGS.find(c=>exTime(ex,c)<=per)||CONFIGS[CONFIGS.length-1];return{id,c,sec:exTime(ex,c)}});
  const used=WARM+COOL+items.reduce((a,i)=>a+i.sec,0);
  return{items,used,total:minutes*60};
}

// ===================== REP COUNTING =====================
const ang=(a,b,c)=>{const v1=[a.x-b.x,a.y-b.y],v2=[c.x-b.x,c.y-b.y];return Math.abs(Math.atan2(v1[0]*v2[1]-v1[1]*v2[0],v1[0]*v2[0]+v1[1]*v2[1])*180/Math.PI)};
// degrees the upper arm is away from hanging straight down (over 90 means the elbow is above the shoulder)
const driftDeg=(sh,el)=>Math.atan2(Math.abs(el.x-sh.x),el.y-sh.y)*180/Math.PI;
const JN={11:'shoulder',12:'shoulder',13:'elbow',14:'elbow',15:'wrist',16:'wrist',23:'hip',24:'hip',25:'knee',26:'knee',27:'ankle',28:'ankle'};
const FRAMES=4;      // a mistake must last this many camera frames before it counts
const FAULT_MEMORY=6000; // ms a mistake stays attached to the next rep
// Each fault: minor = rep still counts but loses score; major = rep is NOT counted (Balanced strictness)
const AN={
  squat:{pts:[[11,23,25,27],[12,24,26,28]],main:p=>ang(p[1],p[2],p[3]),start:'hi',hi:158,lo:115,good:100,
    faults:p=>{const t=ang(p[0],p[1],p[2]);

      let k=vis.indexOf(Math.max(...vis));

      if(C.active)step(p,a,now);

    const fl=A.faults?A.faults(p):[];

    for(const f of fl){
      C.run[f.id]=(C.run[f.id]||0)+1;

    }

      if(C.stage===1){

      C.stage=0;C.best=null;C.seen={};
    }
  }

}

  curl:{drift:['your elbow drifted','Keep it pinned to your side.','elbow drift'],range:['your curls stopped short','Curl all the way up.','short curls']},
  squat:{fold:['your chest folded forward','Keep your chest up.','chest fold'],range:['your squats were shallow','Sit back and down until your thighs are level.','shallow squats']},
  pushup:{hips:['your hips sagged or rose','Keep your body in one straight line.','hip sag'],range:['your push-ups stopped short','Lower your chest closer to the floor.','short push-ups']},

function analyze(Hraw,today,dismissed={}){

  if(!away&&win)res.win=win.text;
  // weights

}

  const seg=(sec,css,t)=>`<div style="width:${sec/tot*100}%;${css}" ${t?`title="${esc(t)}"`:''}></div>`;
  if(!S.plan.length)return`<div class="tl"></div>`;
  let h='<div class="tl">'+seg(WARM,'','Warm-up').replace('<div','<div class="fix"');
  cp.items.forEach(i=>{const ex=EX[i.id];h+=seg(i.sec,`background:${TARGETS[ex.t].c}`,ex.n)});
  h+=seg(COOL,'','Cool-down').replace('<div','<div class="fix"')+'</div>';
  return h;
}

function autoBuild(){
  const pool=X.filter(eqOK),tg=S.targets.size?[...S.targets]:Object.keys(TARGETS);
  const n=Math.max(3,Math.min(8,Math.round((S.minutes*60-WARM-COOL)/290)));
  const lists=tg.map(t=>pool.filter(e=>e.t===t)),out=[];let i=0,g=0;
  while(out.length<n&&g++<200){const nx=lists[i%lists.length].find(e=>!out.includes(e.id));if(nx)out.push(nx.id);i++;if(lists.every(l=>l.every(e=>out.includes(e.id))))break}
  S.plan=out.sort((a,b)=>PRIO.indexOf(EX[a].t)-PRIO.indexOf(EX[b].t));
}

    drag.on=true;drag.el.classList.add('dragging');const g=$('#ghost');g.innerHTML='';g.appendChild(drag.el.cloneNode(true));g.firstChild.classList.remove('dragging');g.style.display='block'}
  e.preventDefault();

  if(e.clientY<80)scrollBy(0,-14);else if(e.clientY>innerHeight-130)scrollBy(0,14);
  const t=document.elementFromPoint(e.clientX,e.clientY),z=t&&t.closest('[data-drop]');
  $$('.dropz,[data-drop]').forEach(d=>d.classList.toggle('over',d===z&&d.classList.contains('dropz')));
  $$('.pitem').forEach(p=>p.classList.remove('ins','last-ins'));
  if(z&&z.dataset.drop==='plan'){const ix=insIndex(e.clientY),items=$$('.pitem');if(items[ix])items[ix].classList.add('ins');else if(items.length)items[items.length-1].classList.add('last-ins')}
},{passive:false});

const Cam={stream:null,video:null,cv:null,ctx:null,raf:0,mirror:true,counter:null,mode:'off',readySince:0,countT:0,lms:null,lastVT:-1,rec:null,chunks:[],cue:'',cueT:0,warn:false,info:null,onFrame:null,tgt:0};
async function camOpen(){

  Cam.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:DB.prefs.facing,width:{ideal:960},height:{ideal:720}},audio:false});
  const v=document.createElement('video');v.playsInline=true;v.muted=true;v.srcObject=Cam.stream;await v.play();

function camDetach(){cancelAnimationFrame(Cam.raf);Cam.raf=0;Cam.cv=null;Cam.mode='off'}
function camClose(){recStop();camDetach();if(Cam.stream)Cam.stream.getTracks().forEach(t=>t.stop());Cam.stream=null;Cam.video=null}
const CONN=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
function camAttach(cv,counter,tgt){
  Cam.cv=cv;Cam.ctx=cv.getContext('2d');Cam.counter=counter;Cam.tgt=tgt;Cam.mode='position';Cam.readySince=0;Cam.lms=null;Cam.cue='';Cam.warn=false;counter.active=false;

function camLoop(){
  if(!Cam.cv||!Cam.video)return;

  if(v.videoWidth){
    if(cv.width!==v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;const st=cv.parentElement;if(st&&st.id==='stage')st.style.aspectRatio=cv.width+'/'+cv.height}

    ctx.save();if(Cam.mirror){ctx.translate(W,0);ctx.scale(-1,1)}ctx.drawImage(v,0,0,W,H);ctx.restore();
    if(LM&&v.currentTime!==Cam.lastVT){Cam.lastVT=v.currentTime;try{const r=LM.detectForVideo(v,now);Cam.lms=(r.landmarks&&r.landmarks[0])||null}catch(e){}}

    Cam.info=info;

      if(info&&info.ready){if(!Cam.readySince)Cam.readySince=now;if(now-Cam.readySince>900){Cam.mode='countdown';Cam.countT=now+3000;say('Get ready');beep(660,.1)}}else Cam.readySince=0;

const needTxt=info=>(Cam.need||'Step back until your whole body is in view')+(info&&info.missing&&info.missing.length?' Can’t see: '+info.missing.join(', ')+'.':'');
function drawHL(ctx,W,H,info,mx){

    for(const[ia,ib]of h.pairs){const p=Cam.lms[info.idxs[ia]],q=Cam.lms[info.idxs[ib]];if(!p||!q)continue;ctx.beginPath();ctx.moveTo(mx(p.x),p.y*H);ctx.lineTo(mx(q.x),q.y*H);ctx.stroke()}
    ctx.restore();

}
function drawGuide(ctx,W,H,info){
  if(!info||!info.ready||info.prog==null||Cam.mode==='countdown')return;
  const bw=Math.max(16,W*.04),x=W-bw-18,y0=H*.2,y1=H*.8,h=y1-y0,ty=y1-h*Math.min(1,info.thr),hit=info.prog>=info.thr;

  ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(x,y0,bw,h);
  ctx.fillStyle=hit?'#6BFFC8':'#7C93FF';ctx.fillRect(x,y1-h*info.prog,bw,h*info.prog);

  ctx.lineWidth=4;ctx.strokeStyle='rgba(11,18,32,.8)';ctx.strokeText(hit?'Rep counts':'Reach here',x-14,ty);ctx.fillStyle='#fff';ctx.fillText(hit?'Rep counts':'Reach here',x-14,ty);

      ctx.strokeStyle=act.has(a)&&act.has(b)?'#6BFFC8':'rgba(255,255,255,.55)';ctx.beginPath();ctx.moveTo(mx(p.x),p.y*H);ctx.lineTo(mx(q.x),q.y*H);ctx.stroke()}
    for(const i of [11,12,13,14,15,16,23,24,25,26,27,28]){const p=Cam.lms[i];if(!p||(p.visibility||0)<.4)continue;ctx.fillStyle=act.has(i)?'#2B4EFF':'#fff';ctx.beginPath();ctx.arc(mx(p.x),p.y*H,Math.max(4,W*.008),0,7);ctx.fill()}

  const banner=(t,c)=>{ctx.font=`700 ${Math.round(fs*.62)}px Figtree, Arial, sans-serif`;const w=Math.min(W-24,ctx.measureText(t).width+28),h=fs*1.2;ctx.fillStyle=c;ctx.fillRect((W-w)/2,H-h-14,w,h);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,W/2,H-h/2-14,W-40);ctx.textAlign='left';ctx.textBaseline='top'};
  if(Cam.mode==='position'){banner(info&&info.ready?'Hold still...':needTxt(info),info&&info.ready?'rgba(18,163,122,.9)':'rgba(229,72,77,.9)')}
  else if(Cam.mode==='countdown'){const n=Math.ceil((Cam.countT-now)/1000);ctx.font=`900 ${Math.round(W*.3)}px Archivo, Arial`;ctx.fillStyle='rgba(255,255,255,.9)';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n,W/2,H/2);ctx.textAlign='left';ctx.textBaseline='top'}

  ${formBlock}${bodyBlock}${wBlock}
  <div class="card"><h3>Rewards</h3>
    <div class="hero2" style="margin:0 0 10px">${sprout(L.lvl)}<div style="flex:1"><div style="font-family:var(--disp);font-stretch:112%;font-weight:800;font-size:24px">Level ${L.lvl}</div><div class="small" style="opacity:.75">${L.need-L.into} XP to level ${L.lvl+1}. Your plant grows as you do.</div><div class="bar"><b style="width:${L.into/L.need*100}%"></b></div></div></div>
    <div class="stats" style="margin-bottom:10px"><div><b>${st.n}</b><span>${st.alive?'workout streak':'streak (restart today)'}</span></div><div><b>${H.length}</b><span>workouts</span></div><div><b>${H.reduce((a,h)=>a+h.reps,0)}</b><span>total reps</span></div></div>
    <div class="badges">${BADGES.map(b=>`<div class="bdg ${er.has(b.id)?'':'lock'}"><span class="ic">${b.ic}</span>${b.n}</div>`).join('')}</div></div>
  <p style="text-align:center;margin:18px 0">${H.some(h=>h.demo)?'<button class="link" data-act="clearDemo">Remove sample data</button>':'<button class="link" data-act="seed">Add sample data to preview</button>'}</p>`;
  $('#dockHost').innerHTML='';
}

// ===================== ROUTER & EVENTS =====================
function render(){
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.tab));
  if(S.tab==='build')renderBuild();else renderProgress();
  renderChip();
}
const ACT={
  tab:b=>{S.tab=b.dataset.v;closeSheet();render();scrollTo(0,0)},
  target:b=>{const k=b.dataset.k;S.targets.has(k)?S.targets.delete(k):S.targets.add(k);renderBuild()},
  minutes:b=>{S.minutes=+b.dataset.m;renderBuild()},
  equip:b=>{S.equip=b.dataset.k;renderBuild()},
  add:b=>{if(!S.plan.includes(b.dataset.id))S.plan.push(b.dataset.id);renderBuild()},
  addClose:b=>{if(!S.plan.includes(b.dataset.id))S.plan.push(b.dataset.id);closeSheet();renderBuild()},
  remove:b=>{S.plan.splice(+b.dataset.i,1);renderBuild()},
  auto:()=>{autoBuild();renderBuild();toast('Workout built for '+S.minutes+' minutes')},
  start:()=>startSession(),
  quick:b=>startQuick(b.dataset.id),
  preview:b=>openSheet(b.dataset.id),
  closeSheet,noop:()=>{},
  seed:()=>{seedDemo();render()},
  ddis:b=>{DB.dismissed=DB.dismissed||{};DB.dismissed[b.dataset.k]=dayNum();save();render()},
  dgo:b=>{const c=DASH[+b.dataset.i];if(!c)return;const a=c.a||{};
    if(a.t==='practise'){startQuick(a.id);return}
    if(a.t==='plan'){S.targets=new Set([a.k]);autoBuild();S.tab='build';render();scrollTo(0,0);toast('Workout built for '+TARGETS[a.k].n.toLowerCase());return}
    if(a.t==='add'){if(!S.plan.includes(a.id))S.plan.push(a.id);S.tab='build';render();scrollTo(0,0);toast(EX[a.id].n+' added to your plan');return}
    if(a.t==='away'){S.minutes=20;S.targets=new Set();autoBuild();S.tab='build';render();scrollTo(0,0);toast('A 20 minute workout is ready');return}
    S.tab='build';render();scrollTo(0,0)},
  clearDemo:()=>{DB.history=DB.history.filter(h=>!h.demo);save();render()},
  endSession:()=>{const s=S.session,any=s.items.some(i=>i.sets.some(x=>x.reps>0));if(s.phase==='sum'){closeSession();return}
    if(confirm(any?'End this workout? Your finished sets will be saved.':'Leave this workout?')){if(any)toSummary();else closeSession()}},
  goIntro:b=>goIntro(+b.dataset.i),
  wdn:()=>{const s=S.session,it=s.items[s.idx],st=EX[it.id].eq==='gym'?2.5:1;it.w=Math.max(0,Math.round((it.w-st)*2)/2);$('#wv').textContent=it.w+' kg'},
  wup:()=>{const s=S.session,it=s.items[s.idx],st=EX[it.id].eq==='gym'?2.5:1;it.w=Math.round((it.w+st)*2)/2;$('#wv').textContent=it.w+' kg'},
  togCam:()=>{const s=S.session;s.useCam=!s.useCam;DB.prefs.cam=s.useCam;save();sRender()},
  togRec:()=>{const s=S.session;s.rec=!s.rec;sRender()},
  togVoice:b=>{DB.prefs.voice=!DB.prefs.voice;save();b.classList.toggle('on',DB.prefs.voice);b.textContent='Voice '+(DB.prefs.voice?'on':'off');if(!DB.prefs.voice)try{speechSynthesis.cancel()}catch(e){}},
  togRecNow:b=>{const s=S.session;s.rec=!s.rec;b.classList.toggle('on',s.rec);b.innerHTML='<i></i>'+(s.rec?'Recording':'Record');if(s.rec){const it=s.items[s.idx];recStart(`${EX[it.id].n}, set ${it.sets.length+1}`)}else recStop()},
  flipCam:async()=>{DB.prefs.facing=DB.prefs.facing==='user'?'environment':'user';save();const s=S.session;camClose();sRender()},
  startSet:()=>{const s=S.session;s.phase='set';sRender()},
  skipEx:()=>{const s=S.session;camClose();if(s.idx<s.items.length-1)goIntro(s.idx+1);else{s.phase='cool';sRender()}},
  manualRep:()=>{const s=S.session;repDone(s.cur.reps+1)},
  finishSet:()=>finishSet(),
  holdGo:b=>{const s=S.session,it=s.items[s.idx],tg=tgtOf(EX[it.id],it.c);
    if(s.cur.running){finishSet();return}
    let n=3;b.textContent='Get ready... 3';say('Get ready');beep(660,.1);
    s.hold=setInterval(()=>{n--;if(n>0){b.textContent='Get ready... '+n;beep(660,.1);return}
      clearInterval(s.hold);s.cur.running=true;b.textContent='Stop hold';beep(1040,.2);say('Hold');
      s.hold=setInterval(()=>{s.cur.reps++;const r=$('#repNum');if(r)r.textContent=s.cur.reps;if(s.cur.reps===tg-5)say('Five seconds');if(s.cur.reps>=tg){clearInterval(s.hold);say('Set complete');finishSet()}},1000)},1000)},
  addRest:()=>{const s=S.session;s.endAt+=15000;s.total+=15},
  skipRest:()=>continueFromRest(),
  toSummary:()=>toSummary(),
  soundTest:()=>{
    beep(660,.2);setTimeout(()=>beep(990,.25),260);
    const a=audioCtx(),hasS='speechSynthesis'in window,n=hasS?speechSynthesis.getVoices().length:0;
    let m='You should hear two beeps and a voice. Nothing? Check your volume and that this tab is not muted.';
    if(!a)m='This browser cannot play sound.';
    else if(!hasS)m='Beeps only. This browser has no voice support.';
    else if(!n)m='Beeps only. No voice is installed on this device. Add a text-to-speech voice in your system settings.';
    else if(!DB.prefs.voice)m='Beeps only. Voice is switched off.';
    if(hasS&&n)say('Sound check. One, two, three.');
    toast(m);
  },
  closeSession
};
document.addEventListener('click',e=>{
  if(Date.now()-justDragged<120){justDragged=0;return}
  const b=e.target.closest('[data-act]');if(!b)return;
  if(b.closest('#sheet')&&e.target===$('#sheet'))return;
  const f=ACT[b.dataset.act];if(f)f(b,e);
});
$('#sheet').addEventListener('click',e=>{if(e.target===$('#sheet'))closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){try{speechSynthesis.cancel()}catch(e){}}else if(S.session)wakeOn()});
render();requestAnimationFrame(animTick);
</script>
</body>
</html>
